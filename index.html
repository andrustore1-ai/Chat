<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash Top WhatsApp AI</title>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f1f5f9;color:#0f172a;display:grid;min-height:100vh;place-items:center;padding:18px}
.card{width:min(620px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 18px 60px rgba(15,23,42,.1)}
h1{margin:0 0 8px;color:#047857}p{line-height:1.8;color:#475569}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;white-space:pre-wrap;margin:12px 0}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#10b981;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
button.alt{background:#2563eb}.ok{color:#047857}.bad{color:#dc2626}.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<div class="card">
<h1>🤖 Cash Top WhatsApp AI</h1>
<p>هذه الصفحة تعني أن مشروع Vercel يعمل. البوت نفسه موجود في <b>/api/webhook</b>.</p>
<div id="status" class="status">جاري فحص النظام...</div>
<button class="alt" onclick="check()">فحص الاتصال</button>
<button onclick="setup()">ربط GREEN API بهذا المشروع</button>
<p class="small">قبل زر الربط يجب إضافة متغيرات GREEN API في Vercel. بعد الربط قد تحتاج إعدادات GREEN API عدة دقائق حتى تُطبق.</p>
</div>
<script>
async function check(){
 const el=document.getElementById('status');el.textContent='جاري الفحص...';
 try{const r=await fetch('/api/status');const d=await r.json();el.className='status '+(d.ok?'ok':'bad');el.textContent=JSON.stringify(d,null,2)}
 catch(e){el.className='status bad';el.textContent=e.message}
}
async function setup(){
 const el=document.getElementById('status');el.textContent='جاري ربط GREEN API...';
 try{
   const r=await fetch('/api/setup',{method:'POST'});const d=await r.json();
   el.className='status '+(d.ok?'ok':'bad');el.textContent=JSON.stringify(d,null,2);
 }catch(e){el.className='status bad';el.textContent=e.message}
}
check();
</script>
</body>
</html>
